# KB Curation: separate from the chatbot stack in ../docker-compose.yml.
# Run from this folder:  docker compose up -d --build
#
# Settings come from kb-curation/.env (not committed):
#   KB_DB_PASSWORD      password for the bundled Postgres (internal network only)
#   KB_BASE_PATH        sub-path the web app is served under, e.g. /kb-curation
#   KB_PUBLIC_API_URL   URL the browser uses for the API, e.g. /kb-curation-api
#   KB_WEB_ORIGIN       public origin, for CORS
#   KB_WEB_PORT / KB_API_PORT   host ports, bound to 127.0.0.1 only
# The OpenAI key goes in backend/.env (OPENAI_API_KEY=...).
name: kb-curation

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kb_curation
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD:-kb}
    volumes:
      - kb_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb_curation"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://kb:${KB_DB_PASSWORD:-kb}@db:5432/kb_curation
      WEB_ORIGIN: ${KB_WEB_ORIGIN:-http://localhost:3030}
      KB_DATA_DIR: /data
    volumes:
      - kb_data:/data
    ports:
      - "127.0.0.1:${KB_API_PORT:-8030}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${KB_PUBLIC_API_URL:-http://localhost:8030}
        NEXT_BASE_PATH: ${KB_BASE_PATH:-}
    ports:
      - "127.0.0.1:${KB_WEB_PORT:-3030}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  kb_db:
  kb_data:
