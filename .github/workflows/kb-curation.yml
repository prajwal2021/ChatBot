name: KB Curation

on:
  push:
    branches: [chatbot_V1]
    paths: ["kb-curation/**", ".github/workflows/kb-curation.yml"]
  pull_request:
    paths: ["kb-curation/**", ".github/workflows/kb-curation.yml"]
  workflow_dispatch:

concurrency:
  group: kb-curation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb-curation/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kb -d kb_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SN_TEST_DATABASE_URL: postgresql+psycopg://kb:kb@localhost:5432/kb_test
      DATABASE_URL: postgresql+psycopg://kb:kb@localhost:5432/kb_test
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kb-curation/backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: App imports cleanly
        run: python -c "import app.main"
      - run: python -m pytest tests -v

  web:
    name: Web lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb-curation/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kb-curation/web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /kb-curation-api
          NEXT_BASE_PATH: /kb-curation
          NEXT_TELEMETRY_DISABLED: "1"
